<!DOCTYPE html>
<html lang="en" style="height:100%;height:-webkit-fill-available" style="height:100%;height:-webkit-fill-available">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<title>FIFA World Cup 2026 · Teams</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2F2F7;--surface:#fff;--s2:#F2F2F7;--s3:rgba(120,120,128,.12);
  --label:#000;--l2:rgba(60,60,67,.6);--l3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.12);
  --blue:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--gray:#8E8E93;
  --purple:#AF52DE;
  --font:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
}
body{background:var(--bg);font-family:var(--font);display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available;overflow:hidden;padding:0;margin:0;padding-top:env(safe-area-inset-top);}

/* ── STATUS BAR ── */
/* ── NAV BAR ── */
.nav-bar{height:44px;padding:0 16px;display:flex;align-items:center;
  justify-content:space-between;background:var(--surface);
  border-bottom:.5px solid var(--sep);flex-shrink:0}
.nav-title{font-size:17px;font-weight:600;color:var(--label);letter-spacing:-.4px}

/* ── SEARCH BAR ── */
.search-wrap{padding:8px 14px;background:var(--surface);
  border-bottom:.5px solid var(--sep);flex-shrink:0}
.search-input{
  display:flex;align-items:center;gap:8px;
  background:var(--s3);border-radius:10px;padding:7px 10px;
  cursor:text;
}
.search-input input{
  border:none;background:transparent;outline:none;
  font-size:15px;color:var(--label);font-family:var(--font);flex:1;
  caret-color:var(--blue);
}
.search-input input::placeholder{color:var(--l3)}

/* ── SORT BAR ── */
.sort-bar{
  display:flex;gap:0;padding:8px 14px;
  background:var(--surface);border-bottom:.5px solid var(--sep);flex-shrink:0;
}
/* Segmented control */
.seg-ctrl{
  display:flex;background:var(--s3);border-radius:8px;padding:2px;
  gap:2px;
}
.seg-btn{
  flex:1;padding:5px 0;border-radius:6px;
  font-size:12px;font-weight:500;color:var(--l2);text-align:center;
  cursor:pointer;transition:all .2s cubic-bezier(.34,1.4,.64,1);
  white-space:nowrap;
}
.seg-btn.active{
  background:var(--surface);color:var(--label);font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.seg-btn:active{transform:scale(.94)}

/* ── SCROLL AREA ── */
.scroll-area{min-height:0;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll-area::-webkit-scrollbar{display:none}

/* ── SECTION HEADER (A–Z letter / Group / Rank band) ── */
.list-section-hd{
  padding:6px 16px 4px;
  font-size:12px;font-weight:600;color:var(--l3);letter-spacing:.04em;text-transform:uppercase;
  background:var(--bg);
  position:sticky;top:0;z-index:10;
}

/* ── TEAM ROW ── */
.team-row{
  /* [flag+name 1fr] [ovr 32px] [rank 44px] [chev 20px] */
  display:grid;
  grid-template-columns:1fr 32px 44px 20px;
  align-items:center;
  padding:9px 0 9px 14px;
  background:var(--surface);
  border-bottom:.5px solid var(--sep);
  cursor:pointer;
  transition:background .12s ease;
  position:relative;
  -webkit-tap-highlight-color:transparent;
}
.team-row:active{background:var(--s2)}
.rank-accent{
  position:absolute;left:0;top:6px;bottom:6px;width:2.5px;border-radius:2px;
}
/* Zone 1 — flag + name/sub stacked */
.team-row-inner{
  display:flex;align-items:center;gap:0;min-width:0;padding-right:8px;
}
.team-flag{
  width:30px;height:20px;border-radius:3px;object-fit:cover;
  border:.5px solid rgba(0,0,0,.08);background:transparent;display:block;
  flex-shrink:0;margin-right:10px;
}
.team-name-group{flex:1;min-width:0}
.team-name{
  font-size:14px;font-weight:500;color:var(--label);letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:block;
}
/* Sub-info row: group · confederation */
.team-sub-info{
  display:flex;align-items:center;gap:3px;margin-top:2px;
}
.team-group-tag{
  font-size:11px;font-weight:600;color:var(--blue);
  white-space:nowrap;flex-shrink:0;
}
.team-sub-sep{font-size:11px;color:var(--l3);flex-shrink:0}
.team-conf{font-size:11px;color:var(--l3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* OVR badge */
.team-ovr-lbl{
  font-size:13px;font-weight:700;text-align:center;flex-shrink:0;
}
.team-mid{ display:contents }
.team-mid-dot{ display:none }
.team-sep{ display:none }

/* Right side: rank number + strength bar */
.team-rank-col{
  display:flex;flex-direction:column;align-items:flex-end;gap:5px;
}
.team-rank-num{font-size:12.5px;font-weight:600;color:var(--l2);letter-spacing:-.2px}
/* Strength bar: log scale, 44px strong → 4px weak */
.team-rank-bar{
  height:4px;border-radius:3px;max-width:44px;
  transition:width .5s cubic-bezier(.34,1.2,.64,1);
}
/* Chev sits in its own 26px column with built-in padding */
.chev{opacity:.2;align-self:center;margin-left:6px;}

/* ── DETAIL PAGE ── */
.detail-page{
  position:fixed;inset:0;background:var(--bg);
  overflow:hidden;
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .38s cubic-bezier(.34,1.1,.64,1);
  z-index:150;
}
.detail-page.open{transform:translateX(0)}

/* Detail Nav */
.detail-nav{height:44px;align-items:center;
  padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-bottom:.5px solid var(--sep);flex-shrink:0;
  
}
.back-btn{display:flex;align-items:center;gap:4px;
  color:var(--blue);font-size:15px;font-weight:500;cursor:pointer;
  -webkit-tap-highlight-color:transparent;padding:4px 0}
.back-btn:active{opacity:.6}
.detail-nav-title{font-size:15px;font-weight:600;color:var(--label);letter-spacing:-.3px}
.share-btn{color:var(--blue);font-size:15px;cursor:pointer;padding:4px}

.detail-scroll{min-height:0;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.detail-scroll::-webkit-scrollbar{display:none}

/* ── DETAIL: HERO — two-zone like player detail ── */
/* Zone A: team emblem + name */
.hero-a{
  padding:28px 20px 22px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  background:#F5EFE8; /* overridden by JS */
}
/* Large team badge: flag as emblem */
.hero-emblem{
  width:100px;height:100px;
  /* No circle — badge displays at full natural shape */
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.22));
}
.hero-emblem-flag{
  width:100%;height:100%;object-fit:contain;
  display:block;
}
.hero-name{
  font-size:24px;font-weight:700;color:#1A1A1A;
  letter-spacing:-.5px;text-align:center;line-height:1.15;
}

/* Zone B: primary color bar — grid of 4 elements */
.hero-b{
  padding:14px 14px 16px;
  display:grid;
  grid-template-columns:1fr 56px 56px 1fr;
  gap:8px;
  align-items:stretch;
  background:#1C1C2E; /* overridden by JS */
}
/* Col 1: flag + abbr */
.hb-flag-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.hb-flag{width:52px;height:35px;border-radius:5px;object-fit:cover;
  border:.5px solid rgba(255,255,255,.2);display:block}
.hb-abbr{font-size:11px;font-weight:600;color:rgba(255,255,255,.75);
  letter-spacing:.04em;text-align:center}
/* Cols 2+3: dark tiles (same as player detail) */
.hb-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;background:rgba(255,255,255,.1);border-radius:10px;padding:10px 4px}
.hb-tile-lbl{font-size:9px;font-weight:600;color:rgba(255,255,255,.4);
  text-transform:uppercase;letter-spacing:.07em;line-height:1}
.hb-tile-val{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.5px;line-height:1}
/* Col 4: OVR stars */
.hb-ovr-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.hb-ovr-num{font-size:38px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.hb-stars{display:flex;align-items:center;gap:2px}

/* Radar chart wrapper */
.radar-wrap{width:220px;height:220px;position:relative;margin:0 auto}

/* compat stubs */
.hero,.hero-flag,.hero-meta,.hero-group,.hero-abbr,.hero-rank-row,.rank-badge,.rank-badge-num,.rank-badge-lbl{display:none!important}

/* ── DETAIL: SECTION ── */
.detail-section{padding:20px 0 8px}
.ds-title{font-size:20px;font-weight:700;color:var(--label);letter-spacing:-.5px;
  padding:0 16px 12px}

/* ── DETAIL: HISTORY ── */
.history-row{
  display:flex;align-items:center;padding:10px 16px;
  background:var(--surface);border-bottom:.5px solid var(--sep);gap:12px}
.history-year{font-size:14px;font-weight:600;color:var(--label);width:40px;flex-shrink:0}
.history-host-flag{width:22px;height:15px;border-radius:2px;object-fit:cover;
  border:.5px solid rgba(0,0,0,.08);flex-shrink:0;background:#eee}
.history-result{
  flex:1;font-size:14px;font-weight:500;
}
.history-result.champion{color:#B8860B}
.history-result.runner{color:var(--gray)}
.history-result.third{color:#CD7F32}
.history-result.out{color:var(--l3);font-weight:400}
.history-badge{
  font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;flex-shrink:0;
}
.hb-gold{background:rgba(218,165,32,.15);color:#B8860B}
.hb-silver{background:rgba(120,120,128,.12);color:var(--gray)}
.hb-bronze{background:rgba(205,127,50,.12);color:#CD7F32}

/* ── DETAIL: SQUAD ── */
.squad-filter{
  display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.squad-filter::-webkit-scrollbar{display:none}
.sf-chip{
  flex-shrink:0;padding:5px 14px;border-radius:20px;
  font-size:13px;font-weight:500;color:var(--l2);
  background:var(--s3);cursor:pointer;white-space:nowrap;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.sf-chip:active{transform:scale(.92)}
.sf-chip.active{background:var(--blue);color:#fff;font-weight:600}

.player-row{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:var(--surface);border-bottom:.5px solid var(--sep);
  cursor:pointer;transition:background .1s ease;
}
.player-row:active{background:var(--s2)}
.player-num{
  width:26px;text-align:center;font-size:13px;font-weight:600;
  color:var(--l3);flex-shrink:0;
}
/* player avatar placeholder */
.player-avatar{
  width:36px;height:36px;border-radius:50%;
  background:var(--s3);flex-shrink:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;
}
.player-avatar-img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.player-info{flex:1;min-width:0}
.player-name{font-size:14px;font-weight:500;color:var(--label);letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-club-row{display:flex;align-items:center;gap:4px;margin-top:1px}
.player-club-flag{width:14px;height:10px;border-radius:1.5px;object-fit:cover;
  border:.5px solid rgba(0,0,0,.07);flex-shrink:0;background:#eee}
.player-club{font-size:11.5px;color:var(--l3)}
.player-pos-badge{
  font-size:10px;font-weight:600;padding:1.5px 5px;border-radius:4px;flex-shrink:0;
  width:28px;text-align:center;
}
.pos-gk{background:rgba(255,149,0,.15);color:#CC7A00}
.pos-df{background:rgba(52,199,89,.12);color:#1A7A38}
.pos-mf{background:rgba(0,122,255,.12);color:#005EC4}
.pos-fw{background:rgba(255,59,48,.1);color:#CC2020}
/* Right columns: pos | ovr | value — fixed widths, right-aligned */
.player-right-cols{
  display:flex;align-items:center;gap:6px;flex-shrink:0;
}
.player-ovr{
  font-size:13px;font-weight:700;
  width:24px;text-align:right;
}
.player-value{
  font-size:11.5px;font-weight:500;color:var(--l2);
  width:44px;text-align:right;flex-shrink:0;
}

/* ── CAPTAIN BADGE ── */
.captain-badge{
  font-size:10px;font-weight:700;color:#B8860B;
  background:rgba(184,134,11,.15);border-radius:3px;
  padding:0 4px;margin-left:5px;vertical-align:middle;letter-spacing:.03em;
}
/* ── STAT BARS ── */
.stat-bar-row{display:flex;align-items:center;gap:8px;padding:5px 0}
.stat-bar-lbl{font-size:10px;font-weight:600;color:rgba(60,60,67,.5);width:28px;text-align:right;letter-spacing:.05em;flex-shrink:0}
.stat-bar-track{flex:1;height:5px;border-radius:3px;background:rgba(60,60,67,.08);overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px;width:0;transition:width .55s cubic-bezier(.34,1.2,.64,1)}
.stat-bar-val{font-size:12px;font-weight:700;width:24px;text-align:left;flex-shrink:0}

/* ── TAB BAR ── */
.tab-bar{height:calc(49px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:.5px solid var(--sep);display:flex;align-items:flex-start;
  padding-top:8px;flex-shrink:0;flex-shrink:0;z-index:100}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;padding-top:2px;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.tab-item:active{transform:scale(.85)}
.tab-label{font-size:10px;font-weight:500}
.tab-item.on .tab-label{color:var(--blue)}
.tab-item:not(.on) .tab-label{color:var(--gray)}

/* ── SHARE MODAL ── */
.share-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.45);
  border-radius:54px;z-index:400;align-items:center;justify-content:center;padding:0 24px}
.share-overlay.open{display:flex;animation:fadeIn .18s ease}
.share-modal{background:var(--surface);border-radius:18px;width:100%;overflow:hidden;
  animation:popIn .24s cubic-bezier(.34,1.3,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.share-title{font-size:13px;font-weight:600;color:var(--l2);padding:14px 16px 10px;
  text-transform:uppercase;letter-spacing:.04em}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:0 8px 16px}
.share-opt{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 4px;cursor:pointer;border-radius:12px;
  transition:background .12s ease}
.share-opt:active,.share-opt:hover{background:var(--s2)}
.share-icon{width:44px;height:44px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
.share-lbl{font-size:10.5px;font-weight:500;color:var(--l2);text-align:center;
  white-space:nowrap}
.share-cancel{display:flex;align-items:center;justify-content:center;
  padding:14px 16px;border-top:.5px solid var(--sep);cursor:pointer;
  font-size:15px;font-weight:500;color:var(--blue)}
.share-cancel:active{opacity:.6}
</style>
</head>
<body>

<!-- Nav Bar -->
<div class="nav-bar">
  <span class="nav-title">Teams</span>
  <div style="width:32px"></div>
</div>

<!-- Search -->
<div class="search-wrap">
  <div class="search-input">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
      <circle cx="6.5" cy="6.5" r="4.5" stroke="#8E8E93" stroke-width="1.4"/>
      <path d="M10 10l3.5 3.5" stroke="#8E8E93" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <input id="searchInput" type="text" placeholder="Search teams" oninput="onSearch()" autocomplete="off" spellcheck="false">
  </div>
</div>

<!-- Sort Bar -->
<div class="sort-bar">
  <div class="seg-ctrl" style="width:100%">
    <div class="seg-btn active" onclick="setSort('rank',this)">FIFA Rank</div>
    <div class="seg-btn" onclick="setSort('group',this)">Group</div>
    <div class="seg-btn" onclick="setSort('name',this)">Name</div>
  </div>
</div>

<!-- Team List -->
<div class="scroll-area" id="teamListScroll">
  <div id="teamList"></div>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
  <div class="tab-item" onclick="window.location.href='tab1.html'">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M3 6h18M3 12h18M3 18h10" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="tab-label">Standings</span>
  </div>
  <div class="tab-item" onclick="window.location.href='tab2.html'">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="4" width="18" height="17" rx="3" stroke="#8E8E93" stroke-width="1.8" fill="none"/>
      <path d="M16 2v4M8 2v4M3 9h18" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="8" cy="14" r="1.2" fill="#8E8E93"/>
      <circle cx="12" cy="14" r="1.2" fill="#8E8E93"/>
    </svg>
    <span class="tab-label">Schedule</span>
  </div>
  <div class="tab-item on">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M12 3L4 7v5c0 4.4 3.4 8.5 8 9.5 4.6-1 8-5.1 8-9.5V7l-8-4z" stroke="#007AFF" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    </svg>
    <span class="tab-label">Teams</span>
  </div>
  <div class="tab-item" onclick="window.location.href='tab4.html'">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="8" r="4" stroke="#8E8E93" stroke-width="1.8" fill="none"/>
      <path d="M5 20c0-3.31 3.13-6 7-6s7 2.69 7 6" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    </svg>
    <span class="tab-label">Players</span>
  </div>
</div>

<!-- ── DETAIL PAGE ── -->
<div class="detail-page" id="detailPage">
<!-- Detail Nav -->
  <div class="detail-nav">
    <div class="back-btn" onclick="closeDetail()">
      <svg width="9" height="15" viewBox="0 0 9 16" fill="none">
        <path d="M8 1L1 8l7 7" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Teams
    </div>
    <span class="detail-nav-title" id="detailNavTitle">—</span>
    <div class="share-btn" onclick="openShare()">
      <svg width="16" height="18" viewBox="0 0 18 20" fill="none">
        <path d="M13 7l-4-4-4 4M9 3v10" stroke="#007AFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 13v4a1 1 0 001 1h10a1 1 0 001-1v-4" stroke="#007AFF" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="detail-scroll" id="detailScroll">

    <!-- Hero: Zone A + Zone B -->
    <div class="hero-a" id="heroZoneA">
      <div class="hero-emblem">
        <img class="hero-emblem-flag" id="heroEmblem" src="" alt="">
      </div>
      <div class="hero-name" id="heroName">—</div>
    </div>

    <div class="hero-b" id="heroZoneB">
      <!-- Col 1: flag + abbr -->
      <div class="hb-flag-col">
        <img class="hb-flag" id="heroFlag2" src="" alt="">
        <span class="hb-abbr" id="heroAbbr2">—</span>
      </div>
      <!-- Col 2: FIFA Rank -->
      <div class="hb-tile">
        <span class="hb-tile-lbl">FIFA</span>
        <span class="hb-tile-val" id="heroRankNum">—</span>
      </div>
      <!-- Col 3: WC Titles -->
      <div class="hb-tile">
        <span class="hb-tile-lbl">Titles</span>
        <span class="hb-tile-val" id="heroTitles">—</span>
      </div>
      <!-- Col 4: Overall stars -->
      <div class="hb-ovr-col">
        <div class="hb-ovr-num" id="heroOvrNum">—</div>
        <div class="hb-stars" id="heroStars"></div>
      </div>
    </div>

    <!-- Radar Chart (stays inside detail-scroll) -->
    <div style="background:var(--surface);padding:16px;border-bottom:.5px solid var(--sep)">
      <div style="font-size:12px;font-weight:600;color:var(--l3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px">Attributes</div>
      <div class="radar-wrap">

// ── RANK BAR HELPERS ──
// 5-tier color: blue(≤10) green(11–25) yellow(26–50) orange(51–100) red(101+)
function rankColor(r){
  if(r<=10) return '#007AFF';
  if(r<=25) return '#34C759';
  if(r<=50) return '#FFD60A';
  if(r<=100) return '#FF9500';
  return '#FF3B30';
}

// ── BUILD TEAM LIST ──
let currentSort = 'rank';
let searchQuery = '';

function buildList(){
  const container = document.getElementById('teamList');
  container.innerHTML = '';

  let teams = TEAMS.filter(t =>
    !searchQuery ||
    t.name.toLowerCase().includes(searchQuery) ||
    t.abbr.toLowerCase().includes(searchQuery)
  );

  if(currentSort === 'name'){
    teams = teams.slice().sort((a,b) => a.name.localeCompare(b.name));
    let lastLetter = '';
    teams.forEach(t => {
      const letter = t.name[0].toUpperCase();
      if(letter !== lastLetter){
        lastLetter = letter;
        const hd = document.createElement('div');
        hd.className = 'list-section-hd'; hd.textContent = letter;
        container.appendChild(hd);
      }
      container.appendChild(makeRow(t));
    });

  } else if(currentSort === 'group'){
    teams = teams.slice().sort((a,b) => a.group.localeCompare(b.group)||a.rank-b.rank);
    let lastGroup = '';
    teams.forEach(t => {
      if(t.group !== lastGroup){
        lastGroup = t.group;
        const hd = document.createElement('div');
        hd.className = 'list-section-hd'; hd.textContent = 'Group ' + t.group;
        container.appendChild(hd);
      }
      container.appendChild(makeRow(t));
    });

  } else { // rank
    teams = teams.slice().sort((a,b) => a.rank - b.rank);
    const bands = [{label:'Top 10',max:10},{label:'11 – 30',max:30},{label:'31 – 60',max:60},{label:'61+',max:999}];
    let bIdx = 0;
    teams.forEach(t => {
      while(bIdx < bands.length-1 && t.rank > bands[bIdx].max) bIdx++;
      const hd_id = 'band-' + bIdx;
      if(!container.querySelector('#'+hd_id)){
        const hd = document.createElement('div');
        hd.className = 'list-section-hd'; hd.id = hd_id;
        hd.textContent = bands[bIdx].label;
        container.appendChild(hd);
      }
      container.appendChild(makeRow(t));
    });
  }
}

function isLightColor(hex){
  if(!hex) return true;
  const c=hex.replace('#','');
  const r=parseInt(c.slice(0,2),16)||0,g=parseInt(c.slice(2,4),16)||0,b=parseInt(c.slice(4,6),16)||0;
  return (r*299+g*587+b*114)/1000>128;
}
function blendOnDark(hex,alpha){
  if(!hex) return '#1C1C2E';
  const c=hex.replace('#','');
  const r=parseInt(c.slice(0,2),16)||0,g=parseInt(c.slice(2,4),16)||0,b=parseInt(c.slice(4,6),16)||0;
  return `rgb(${Math.round(28*(1-alpha)+r*alpha)},${Math.round(28*(1-alpha)+g*alpha)},${Math.round(46*(1-alpha)+b*alpha)})`;
}
function blendOnWhite(hex,alpha){
  if(!hex||/^#?fff/i.test(hex)) return '#F5EFE8';
  const c=hex.replace('#','');
  const r=parseInt(c.slice(0,2),16)||0,g=parseInt(c.slice(2,4),16)||0,b=parseInt(c.slice(4,6),16)||0;
  return `rgb(${Math.round(255*(1-alpha)+r*alpha)},${Math.round(245*(1-alpha)+g*alpha)},${Math.round(232*(1-alpha)+b*alpha)})`;
}
// 5-star rating for team overall (based on FIFA rank)
function teamStarSVG(filled, size=18){
  const STAR='M10 1L12.06 7.17L18.56 7.22L13.33 11.08L15.29 17.28L10 13.5L4.71 17.28L6.67 11.08L1.44 7.22L7.94 7.17Z';
  const color=filled?'#FFD700':'#2C2C2E';
  return `<svg width="${size}" height="${size}" viewBox="0 0 20 20" fill="none"><path d="${STAR}" fill="${color}" stroke="${filled?'#B8860B':'#1C1C1E'}" stroke-width=".6"/></svg>`;
}
function teamStarsHTML(rank){
  // rank 1-10 = 5 stars, 11-20 = 4, 21-40 = 3+, etc
  const total = rank<=5?5:rank<=15?4:rank<=30?3:rank<=60?2:1;
  return Array.from({length:5},(_,i)=>teamStarSVG(i<total)).join('');
}

// ── RADAR CHART — PAC/SHO/PAS/DRI/DEF/PHY, values at data points ──
function drawRadar(t){
  const canvas = document.getElementById('radarCanvas');
  const ctx = canvas.getContext('2d');
  const DPR = window.devicePixelRatio||1;
  const SIZE = 220;
  canvas.width = SIZE*DPR; canvas.height = SIZE*DPR;
  canvas.style.width = SIZE+'px'; canvas.style.height = SIZE+'px';
  ctx.scale(DPR,DPR);
  const cx=SIZE/2, cy=SIZE/2, r=74;
  ctx.clearRect(0,0,SIZE,SIZE);

  const s = t.stats || t.opta || {};
  const axes = ['PAC','SHO','PAS','DRI','DEF','PHY'];
  const vals = [s.pac||0, s.sho||0, s.pas||0, s.dri||0, s.def||0, s.phy||0];
  const n = axes.length;
  const step = (Math.PI*2)/n;
  const start = -Math.PI/2;

  function pt(i,frac){ const a=start+i*step; return[cx+Math.cos(a)*r*frac, cy+Math.sin(a)*r*frac]; }

  const hex=t.color||'#007AFF';
  const cr=parseInt(hex.slice(1,3),16)||0, cg=parseInt(hex.slice(3,5),16)||0, cb=parseInt(hex.slice(5,7),16)||0;

  // Background rings (4 levels: 25/50/75/100)
  [0.25,0.5,0.75,1].forEach((frac,ri) => {
    ctx.beginPath();
    for(let i=0;i<n;i++){const[x,y]=pt(i,frac); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.closePath();
    ctx.strokeStyle = ri===3 ? 'rgba(60,60,67,.18)' : 'rgba(60,60,67,.08)';
    ctx.lineWidth=ri===3?1.2:0.8; ctx.stroke();
    if(ri===3){ctx.fillStyle='rgba(60,60,67,.02)';ctx.fill();}
  });

  // Axis spokes
  for(let i=0;i<n;i++){
    const[x,y]=pt(i,1);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);
    ctx.strokeStyle='rgba(60,60,67,.1)';ctx.lineWidth=0.8;ctx.stroke();
  }

  // Data polygon
  ctx.beginPath();
  for(let i=0;i<n;i++){const[x,y]=pt(i,vals[i]/100);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.closePath();
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0,`rgba(${cr},${cg},${cb},0.35)`);
  grad.addColorStop(1,`rgba(${cr},${cg},${cb},0.08)`);
  ctx.fillStyle=grad; ctx.fill();
  ctx.strokeStyle=`rgba(${cr},${cg},${cb},0.85)`; ctx.lineWidth=2; ctx.stroke();

  // Axis name labels — outside the ring
  for(let i=0;i<n;i++){
    const a=start+i*step;
    const lx=cx+Math.cos(a)*(r+22), ly=cy+Math.sin(a)*(r+22);
    ctx.font=`600 10px -apple-system,sans-serif`;
    ctx.fillStyle=`rgba(${cr},${cg},${cb},0.85)`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(axes[i],lx,ly);
  }

  // Value labels — AT actual data point position
  for(let i=0;i<n;i++){
    const v = vals[i];
    if(!v) continue;
    const a=start+i*step;
    const frac = v/100;
    // Offset label slightly outward from exact data point for readability
    const labelFrac = Math.min(frac + 0.12, 0.95);
    const vx=cx+Math.cos(a)*r*labelFrac, vy=cy+Math.sin(a)*r*labelFrac;
    const pw=24,ph=15;
    ctx.fillStyle='rgba(255,255,255,0.92)';
    roundRect(ctx,vx-pw/2,vy-ph/2,pw,ph,4);ctx.fill();
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},0.4)`;ctx.lineWidth=0.8;
    roundRect(ctx,vx-pw/2,vy-ph/2,pw,ph,4);ctx.stroke();
    ctx.font=`700 9.5px -apple-system,sans-serif`;
    ctx.fillStyle=`rgba(${cr},${cg},${cb},1)`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(v),vx,vy);
  }

  // Vertex dots (drawn last, on top)
  for(let i=0;i<n;i++){
    const[x,y]=pt(i,vals[i]/100);
    ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(${cr},${cg},${cb},0.18)`;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,2.8,0,Math.PI*2);
    ctx.fillStyle=`rgba(${cr},${cg},${cb},1)`;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();
  }
}

function renderStatBars(t){

    const v = s[a.key]||0;
    const barColor = v>=80?teamColor:v>=70?'#007AFF':v>=60?'#34C759':'#8E8E93';
    const valColor = v>=80?teamColor:v>=70?'#007AFF':v>=60?'#1C7A3E':'#8E8E93';

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ── SHARE ──
function openShare(){ document.getElementById('shareOverlay').classList.add('open'); }
function closeShare(){ document.getElementById('shareOverlay').classList.remove('open'); }
function closeShareOutside(e){ if(e.target===document.getElementById('shareOverlay')) closeShare(); }
function shareTo(platform){
  const team = currentTeam;
  if(!team){ closeShare(); return; }
  const text = encodeURIComponent('Check out '+team.name+' at FIFA World Cup 2026! #FIFAWorldCup2026');
  const url  = encodeURIComponent('https://fifa.com/worldcup');
  const links = {
    facebook: 'https://www.facebook.com/sharer/sharer.php?u='+url+'&quote='+text,
    twitter:  'https://twitter.com/intent/tweet?text='+text+'&url='+url,
    instagram:'https://www.instagram.com/',
    wechat:   'https://web.wechat.com/',
  };
  if(platform==='instagram'||platform==='wechat'){
    // These don't support direct web share — show a copy-link toast
    navigator.clipboard&&navigator.clipboard.writeText(decodeURIComponent(text+' '+decodeURIComponent(url)));
    closeShare();
    showShareToast(platform==='instagram'?'Copy ready — paste into Instagram':'Copy ready — paste into WeChat');
    return;
  }
  window.open(links[platform],'_blank','width=600,height=500');
  closeShare();
}
function showShareToast(msg){
  // reuse or create toast
  let t = document.getElementById('shareToast');
  if(!t){ t=document.createElement('div'); t.id='shareToast';
    t.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(0,0,0,.76);color:#fff;font-size:12px;font-weight:500;padding:7px 14px;border-radius:20px;white-space:nowrap;opacity:0;z-index:600;transition:opacity .2s ease,transform .2s ease;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)';
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(8px)'; },2600);
}

// ── INIT ──
buildList();
// deep-link: auto-open a team navigated from another tab
const _pendingTeam = sessionStorage.getItem('tab3_team');
if(_pendingTeam){
  sessionStorage.removeItem('tab3_team');
  const _team = TEAMS.find(t => t.code === _pendingTeam);
  if(_team) setTimeout(() => openDetail(_team), 80);
}
